# Windows PC with Docker Desktop (WSL 2 backend). Layered on compose.yml; nothing else changes:
#   docker compose -f deploy/compose.yml -f deploy/compose.windows.yml --env-file deploy/.env up -d
# deploy/windows/Install.ps1 and Start-PersonalFinance.ps1 run this for you (docs/windows.md).
#
# The web container serves plain HTTP on 127.0.0.1 (no `tailscale serve` in front by default) and tells the API that the
# loopback hop is secure, so the browser app window at http://localhost:<HTTP_PORT> can sign in (deploy/Caddyfile.windows).
# Everything else is the server configuration: loopback-only port, read-only non-root containers, internal database
# network, named volumes, and `restart: unless-stopped`, which brings the stack back whenever Docker Desktop starts.
services:
  web:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.windows", "--adapter", "caddyfile"]
