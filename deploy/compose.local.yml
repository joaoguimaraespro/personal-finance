# Try the whole stack on a development PC:
#   Windows:     .\scripts\local-up.ps1
#   macOS/Linux: ./scripts/local-up.sh
# Then open https://localhost:8443 (accept the local certificate).
services:
  api:
    environment:
      Integrations__EnableDemo: "true"

  web:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.local", "--adapter", "caddyfile"]
    ports: !override
      - "127.0.0.1:8443:8443"
