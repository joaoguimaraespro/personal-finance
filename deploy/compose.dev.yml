# Local development database only. Bound to loopback; never used in production.
name: personal-finance-dev
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance_dev
      POSTGRES_PASSWORD: finance_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_dev -d finance"]
      interval: 5s
      retries: 10
volumes:
  dev-db:
