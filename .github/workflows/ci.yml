name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + unit + architecture + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: dotnet test --no-build -c Release

  web:
    name: Web (unit tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx ng build --configuration production

  windows-scripts:
    # Docker Linux containers are not available on Windows runners, so the Windows install is checked statically
    # (parser + PSScriptAnalyzer) and its pure helpers unit-tested (Pester) on PowerShell 7 and Windows PowerShell 5.1.
    # The stack itself is covered by the Linux E2E job with the same images.
    name: Windows scripts (lint + Pester)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Scripts are ASCII and parse (PowerShell 7)
        run: |
          $files = Get-ChildItem deploy/windows -Recurse -Include *.ps1, *.psm1, *.psd1
          $bad = $false
          foreach ($hit in ($files | Select-String -Pattern '[^\x00-\x7F]')) {
            # Windows PowerShell 5.1 reads BOM-less scripts in the ANSI code page.
            "::error file=$($hit.Path),line=$($hit.LineNumber)::non-ASCII character"; $bad = $true
          }
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }
      - name: Scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = $false
          foreach ($f in (Get-ChildItem deploy/windows -Recurse -Include *.ps1, *.psm1, *.psd1)) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -ge '1.22.0')) {
            Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force
          }
          # Scripts and module only: Pester files trip the unused-variable rule (BeforeAll/It scopes), and the settings
          # .psd1 is not a module manifest.
          $results = Get-ChildItem deploy/windows/* -Include *.ps1, *.psm1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings deploy/windows/PSScriptAnalyzerSettings.psd1
          }
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 240
          if ($results) { exit 1 }
      - name: Pester (PowerShell 7)
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'deploy/windows/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'deploy/windows/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  e2e:
    name: E2E against the production images
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build images and start the stack with throwaway secrets
        working-directory: deploy
        run: |
          gen() { openssl rand -base64 48 | tr -d '/+=\n' | cut -c1-40; }
          {
            echo "POSTGRES_SUPERUSER_PASSWORD=$(gen)"
            echo "FINANCE_MIGRATOR_PASSWORD=$(gen)"
            echo "FINANCE_APP_PASSWORD=$(gen)"
            echo "FINANCE_BACKUP_PASSWORD=$(gen)"
            echo "AUTH_SETUP_TOKEN=$(gen)"
            echo "HTTP_PORT=18080"
            echo "API_IMAGE=personal-finance-api:ci"
            echo "WEB_IMAGE=personal-finance-web:ci"
            echo "MCP_IMAGE=personal-finance-mcp:ci"
            echo "INTEGRATIONS_ENABLE_DEMO=true"
          } > .env
          docker compose --env-file .env build
          docker compose --env-file .env up -d --wait
      - name: Images run as non-root
        run: |
          test "$(docker inspect personal-finance-api:ci --format '{{.Config.User}}')" = "app"
          test "$(docker run --rm --entrypoint '' personal-finance-web:ci id -u)" != "0"
      - name: Windows Caddy configuration is valid (deploy/compose.windows.yml)
        run: |
          docker run --rm personal-finance-web:ci caddy validate --config /etc/caddy/Caddyfile.windows --adapter caddyfile
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright journey
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:18080 E2E_FORWARDED_HTTPS=1 \
          E2E_SETUP_TOKEN=$(grep AUTH_SETUP_TOKEN ../deploy/.env | cut -d= -f2) npx playwright test
      - if: failure()
        run: docker compose --env-file deploy/.env -f deploy/compose.yml logs --tail 200
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI instead of gitleaks-action: full-history scan, works on the first push (no <root>^ range).
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0
          git --config .gitleaks.toml --redact --verbose --exit-code 1 .
